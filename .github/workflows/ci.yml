name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # No later step needs the token; keep it out of .git/config.
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Check that the committed migrations match the schema
        run: |
          pnpm --filter @bursar/server db:generate
          if [ -n "$(git status --porcelain -- apps/server/drizzle)" ]; then
            echo "::error::apps/server/drizzle is out of date: run 'pnpm --filter @bursar/server db:generate' and commit the result"
            git status --porcelain -- apps/server/drizzle
            exit 1
          fi
      - run: pnpm test
      - run: pnpm build
      - name: Scan for secrets
        # Scan even when an earlier step failed, so a leaked secret is reported on that run.
        if: ${{ !cancelled() }}
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks git --redact --no-banner .
